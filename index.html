<!DOCTYPE html>
<html>
<head>
    <title>Мой Велоархив</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- КЛАСТЕРИЗАЦИЯ -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
    
    <script src="about.js"></script>
    <script src="points.js"></script>
    <script src="archive/2018/points.js"></script>
    <script src="archive/2019/points.js"></script>
    <script src="archive/2021/points.js"></script>
    <script src="archive/2024/points.js"></script>

    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
        
        /* МЕНЮ */
        #menu-box { position: absolute; top: 15px; left: 15px; z-index: 1000; background: rgba(255, 255, 255, 0.95); padding: 15px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); font-family: sans-serif; min-width: 280px; transition: all 0.3s ease; }
        .menu-collapse-btn { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 16px; cursor: pointer; color: #333; }
        #menu-chevron { transition: transform 0.3s ease; }
        #menu-content { max-height: 1000px; overflow: hidden; opacity: 1; transition: all 0.3s ease; margin-top: 15px; padding-top: 12px; border-top: 1px solid #ccc; }
        #menu-box.collapsed #menu-content { max-height: 0; opacity: 0; margin-top: 0; padding-top: 0; border-top: 1px solid transparent; }
        #menu-box.collapsed #menu-chevron { transform: rotate(180deg); }

        .menu-header { font-weight: bold; font-size: 15px; display: flex; align-items: center; cursor: pointer; color: #333; }
        .menu-header input { margin-right: 12px; transform: scale(1.3); }
        #trip-list { margin-top: 12px; padding-top: 12px; border-top: 1px dashed #ccc; display: none; }
        .trip-item { margin-bottom: 12px; display: flex; align-items: center; font-size: 14px; font-weight: bold; }
        .trip-item input { margin-right: 12px; }
        #photo-toggle-wrap { margin-top: 12px; padding-top: 12px; border-top: 1px dashed #ccc; color: #28a745; font-weight: bold; display: flex; align-items: center; font-size: 15px; cursor: pointer; }
        #photo-toggle-wrap input { margin-right: 12px; transform: scale(1.2); }
        .fs-btn { background: none; border: none; cursor: pointer; font-size: 18px; color: #666; padding: 5px; margin-left: 10px; }

        /* ВИЗИТКА */
        #hint-box { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(255, 255, 255, 0.95); padding: 10px 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-family: sans-serif; cursor: pointer; }
        .hint-text { color: #ff0000; font-weight: 900; font-size: 17px; text-transform: uppercase; letter-spacing: 1px; }

        #about-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 95%; max-width: 440px; max-height: 85vh; border-radius: 20px; padding: 25px; overflow-y: auto; position: relative; font-family: sans-serif; text-align: center; box-sizing: border-box; }
        .close-modal { position: absolute; top: 15px; right: 15px; font-size: 24px; cursor: pointer; color: #aaa; }
        .social-icons i { font-size: 28px; }
        .text-icon-btn { font-weight: 900; font-size: 14px; border: 2px solid #555; padding: 3px 8px; border-radius: 8px; color: #555; text-transform: uppercase; }
        .payment-btn { display: block; width: 100%; text-decoration: none; padding: 12px; border-radius: 12px; margin-top: 10px; font-weight: bold; transition: 0.2s; color: white; }

        /* ФОТО ПРОСМОТРЩИК */
        #photo-viewer { position: absolute; bottom: 100px; left: 15px; z-index: 1000; width: 220px; background: white; padding: 5px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: none; cursor: pointer; touch-action: none; overflow: hidden; }
        #photo-viewer img { width: 100%; border-radius: 5px; display: block; transition: transform 0.1s ease-out; }
        #photo-viewer .close-btn { position: absolute; top: -10px; right: -10px; background: red; color: white; border-radius: 50%; width: 22px; height: 22px; text-align: center; line-height: 20px; font-weight: bold; border: 2px solid white; }

        /* МАРКЕРЫ */
        .day-marker { background: #fff; border-radius: 50%; border: 2.5px solid; color: #000; font-weight: bold; font-family: Arial; display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.5); font-size: 11px; overflow: hidden; white-space: nowrap; }
        .num-wrapper { position: relative; display: inline-block; line-height: 1; }
        .suffix { position: absolute; left: 100%; top: 0; }
        .c2018 { color: #ff0000; border-color: #ff0000 !important; }
        .c2019 { color: #007bff; border-color: #007bff !important; }
        .c2021 { color: #9b59b6; border-color: #9b59b6 !important; }
        .c2024 { color: #ff8c00; border-color: #ff8c00 !important; }
        .cCurrent { color: #28a745; border-color: #28a745 !important; }
        
        /* НОВАЯ "ПРОЗРАЧНАЯ" ФОТО-ИКОНКА СО ВСПЫШКОЙ */
        .photo-marker { background: none !important; border: none !important; display: flex; align-items: center; justify-content: center; overflow: visible !important; }
        .flash-rays { filter: drop-shadow(0 0 2px rgba(255,255,255,0.8)); }

        .trans-center-marker { background: #fff; border-radius: 50%; border: 2.5px solid; display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.5); font-size: 18px; cursor: pointer; }
        .map-avatar { position: absolute; bottom: 24px; right: 10px; z-index: 1000; width: 60px; height: 60px; border-radius: 50%; border: 2px solid white; opacity: 0.8; pointer-events: none; object-fit: cover; transition: 0.3s; }

        /* ПОПАПЫ */
        .popup-box { text-align: center; font-family: sans-serif; min-width: 180px; }
        .popup-box b { font-size: 18px; display: block; margin-bottom: 5px; }
        .btn-row { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .btn { text-decoration: none; font-weight: bold; font-size: 13px; padding: 6px 12px; border-radius: 15px; display: inline-block; }
        .btn-track { background: #28a745; color: white !important; }
        .btn-vk { border: 1px solid #0077FF; color: #0077FF !important; }
        .btn-3d { background: #ffdb00; color: #000 !important; }

        @media (max-width: 768px) {
            #menu-box { left: 5%; width: 90%; top: 15px; box-sizing: border-box; min-width: auto; }
            #hint-box { top: auto; bottom: 30px; }
            .map-avatar { bottom: 18px; right: 5px; width: 45px; height: 45px; }
            #photo-viewer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; padding: 0; border-radius: 0; display: none; justify-content: center; align-items: center; bottom: auto; z-index: 9999; }
            #photo-viewer img { max-width: 100%; max-height: 100%; border-radius: 0; }
            #photo-viewer .close-btn { display: none; }
        }
    </style>
</head>
<body>
    <div id="photo-viewer" onclick="handleBackgroundClick()">
        <div class="close-btn" onclick="closePhoto()">×</div>
        <img id="view-img" src="" onclick="handlePhotoClick(event)">
    </div>

    <div id="about-modal" onclick="closeAbout()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-modal" onclick="closeAbout()">&times;</span>
            <b id="about-name"></b><p id="about-bio"></p>
            <div class="social-icons" id="about-socials"></div>
            <div style="background: #f8f9fa; padding: 20px; border-radius: 15px;">
                <h3 id="support-title"></h3><p id="support-text"></p>
                <div id="payment-buttons"></div>
                <button onclick="toggleQR()" id="qr-btn" style="margin-top:15px; border:1px solid #ccc; padding:8px 15px; border-radius:10px; cursor:pointer;">QR-коды</button>
                <div id="qr-section" style="display:none;"><div id="qr-container"></div></div>
            </div>
        </div>
    </div>

    <div id="hint-box" onclick="openAbout()"><span class="hint-text">ЖМИ СЮДА</span></div>
    <img src="avatar.jpg" class="map-avatar">
    
    <div id="menu-box">
        <div class="menu-collapse-btn">
            <span onclick="toggleMenu()"><i class="fa-solid fa-map-location-dot" style="margin-right:8px; color:#28a745;"></i>Управление картой</span>
            <div>
                <button class="fs-btn" onclick="toggleFullscreen()"><i class="fa-solid fa-expand"></i></button>
                <i class="fa-solid fa-chevron-up" id="menu-chevron" onclick="toggleMenu()"></i>
            </div>
        </div>
        <div id="menu-content">
            <div class="menu-header"><input type="checkbox" id="main-toggle" onchange="toggleList()"> Мои велопутешествия</div>
            <div id="trip-list">
                <div class="trip-item c2018"><input type="checkbox" class="trip-check" id="chk2018" onchange="updateMarkers(false)"> 1. Яранск - Паттайя (2018)</div>
                <div class="trip-item c2019"><input type="checkbox" class="trip-check" id="chk2019" onchange="updateMarkers(false)"> 2. Яранск - Иран (2019)</div>
                <div class="trip-item c2021"><input type="checkbox" class="trip-check" id="chk2021" onchange="updateMarkers(false)"> 3. Яранск - Байкал (2021)</div>
                <div class="trip-item c2024"><input type="checkbox" class="trip-check" id="chk2024" onchange="updateMarkers(false)"> 4. Яранск - Армения (2024)</div>
            </div>
            <div id="photo-toggle-wrap"><input type="checkbox" id="photo-toggle" onchange="updateMarkers(true)"> 📷 Показать фото</div>
        </div>
    </div>

    <div id="map"></div>

    <script>
        var map = L.map('map', {zoomControl: false, attributionControl: true}).setView([50, 80], 4);
        map.attributionControl.setPrefix('Мое велопутешествие');
        L.tileLayer('http://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains:['mt0','mt1','mt2','mt3'] }).addTo(map);

        var currentTripLayer = L.layerGroup().addTo(map);
        var archiveLayerGroup = L.layerGroup().addTo(map);
        var photoClusterGroup = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 40 }).addTo(map);
        var hexColors = { 'c2018': '#ff0000', 'c2019': '#007bff', 'c2021': '#9b59b6', 'c2024': '#ff8c00', 'cCurrent': '#28a745' };

        function toggleMenu() { document.getElementById('menu-box').classList.toggle('collapsed'); }
        function toggleFullscreen() { if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); } else { document.exitFullscreen(); } }
        function closeAbout() { document.getElementById('about-modal').style.display = 'none'; }
        function toggleQR() { var s = document.getElementById('qr-section'); s.style.display = s.style.display === 'block' ? 'none' : 'block'; }

        var img = document.getElementById('view-img');
        var scale = 1, lastScale = 1, startDist = 0, posX = 0, posY = 0, startX = 0, startY = 0, isDragging = false;

        img.addEventListener('touchstart', function(e) {
            if (e.touches.length === 1) { isDragging = true; startX = e.touches[0].pageX - posX; startY = e.touches[0].pageY - posY; } 
            else if (e.touches.length === 2) { isDragging = false; startDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY); lastScale = scale; }
        });
        img.addEventListener('touchmove', function(e) {
            e.preventDefault();
            if (e.touches.length === 1 && isDragging && scale > 1) { posX = e.touches[0].pageX - startX; posY = e.touches[0].pageY - startY; updateTransform(); } 
            else if (e.touches.length === 2) {
                var dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                scale = Math.min(Math.max(1, lastScale * (dist / startDist)), 5); updateTransform();
            }
        });
        img.addEventListener('touchend', function() { isDragging = false; lastScale = scale; });
        function updateTransform() { if (scale <= 1) { posX = 0; posY = 0; } img.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`; }

        function handlePhotoClick(e) {
            e.stopPropagation();
            if (window.innerWidth > 768) { window.open(e.target.src, '_blank'); } 
            else { if (scale > 1.1) { scale = 1; posX = 0; posY = 0; updateTransform(); } else { closePhoto(); } }
        }
        function handleBackgroundClick() { if (window.innerWidth <= 768) closePhoto(); }
        function closePhoto() { scale = 1; lastScale = 1; posX = 0; posY = 0; updateTransform(); document.getElementById('photo-viewer').style.display = 'none'; }

        function openAbout() {
            if (typeof aboutData === 'undefined') return;
            document.getElementById('about-name').innerText = aboutData.name;
            document.getElementById('about-bio').innerText = aboutData.bio;
            document.getElementById('support-title').innerText = aboutData.supportTitle;
            document.getElementById('support-text').innerText = aboutData.supportText;
            var iconMap = { 'vk': 'fa-vk', 'odnoklassniki': 'fa-odnoklassniki', 'instagram': 'fa-instagram', 'youtube': 'fa-youtube', 'telegram': 'fa-telegram', 'strava': 'fa-strava' };
            var sHtml = "";
            aboutData.socials.forEach(s => {
                if(s.url) {
                    if (s.id === 'dzen' || s.id === 'komoot') { sHtml += `<a href="${s.url}" target="_blank"><span class="text-icon-btn">${s.id === 'dzen' ? 'Дзен' : 'Komoot'}</span></a>`; }
                    else { sHtml += `<a href="${s.url}" target="_blank"><i class="fa-brands ${iconMap[s.id] || 'fa-link'}"></i></a>`; }
                }
            });
            document.getElementById('about-socials').innerHTML = sHtml;
            var pHtml = "";
            aboutData.paymentButtons.forEach(p => { pHtml += `<a href="${p.url}" target="_blank" class="payment-btn" style="background:${p.color};">${p.name}</a>`; });
            document.getElementById('payment-buttons').innerHTML = pHtml;
            var qHtml = "";
            aboutData.qrCodes.forEach(q => { qHtml += `<div style="margin-top:15px;"><b>${q.name}</b><img src="${q.img}" class="qr-img"></div>`; });
            document.getElementById('qr-container').innerHTML = qHtml;
            document.getElementById('about-modal').style.display = 'flex';
        }

        function toggleList() { 
            var show = document.getElementById('main-toggle').checked;
            document.getElementById('trip-list').style.display = show ? 'block' : 'none';
            if(!show) { currentTripLayer.addTo(map); archiveLayerGroup.clearLayers(); photoClusterGroup.clearLayers(); document.querySelectorAll('.trip-check').forEach(c => c.checked = false); focusOnCurrent(); } 
            else { map.removeLayer(currentTripLayer); }
            updateMarkers(true);
        }

        function updateMarkers(onlyPhotos) {
            archiveLayerGroup.clearLayers(); photoClusterGroup.clearLayers();
            var showPhotos = document.getElementById('photo-toggle').checked;
            if (!showPhotos) closePhoto();
            var isArchive = document.getElementById('main-toggle').checked;
            if (isArchive) {
                if (document.getElementById('chk2018').checked) { drawTrip(points2018, archiveLayerGroup, 'c2018', 'archive/2018/'); if(showPhotos) loadPhotos('archive-2018-photos', hexColors['c2018']); }
                if (document.getElementById('chk2019').checked) { drawTrip(points2019, archiveLayerGroup, 'c2019', 'archive/2019/'); if(showPhotos) loadPhotos('archive-2019-photos', hexColors['c2019']); }
                if (document.getElementById('chk2021').checked) { drawTrip(points2021, archiveLayerGroup, 'c2021', 'archive/2021/'); if(showPhotos) loadPhotos('archive-2021-photos', hexColors['c2021']); }
                if (document.getElementById('chk2024').checked) { drawTrip(points2024, archiveLayerGroup, 'c2024', 'archive/2024/'); if(showPhotos) loadPhotos('archive-2024-photos', hexColors['c2024']); }
                if (!onlyPhotos) { var layers = archiveLayerGroup.getLayers(); if (layers.length > 0) map.fitBounds(new L.featureGroup(layers).getBounds(), {padding: [50, 50]}); }
            } else {
                if (typeof myPoints !== 'undefined') drawTrip(myPoints, currentTripLayer, 'cCurrent', 'tracks/');
                if(showPhotos) loadPhotos('archive-2026-photos', hexColors['cCurrent']);
            }
        }

        function drawTrip(data, target, colorClass, folder) {
            var hex = hexColors[colorClass];
            data.forEach((p, i) => {
                if (!p.type || p.type === 'day') {
                    var fullDay = String(p.day ? p.day : (i + 1));
                    var markerHtml = '<span class="num-wrapper">' + fullDay.split('-')[0] + '<span class="suffix">' + (fullDay.split('-')[1] ? '-' + fullDay.split('-')[1] : '') + '</span></span>';
                    var icon = L.divIcon({ className: 'day-marker ' + colorClass, html: markerHtml, iconSize: [24, 24], iconAnchor: [12, 12] });
                    L.marker([p.lat, p.lng], {icon: icon}).addTo(target).bindPopup(createPopup(p, folder));
                } else if (p.type === 'transfer') {
                    var line = L.polyline([p.from, p.to], { color: hex, weight: 3, dashArray: '8, 12', opacity: 0.8 }).addTo(target);
                    L.circleMarker(p.from, { radius: 5, color: hex, fillColor: 'white', fillOpacity: 1, weight: 2 }).addTo(target);
                    L.circleMarker(p.to, { radius: 5, color: hex, fillColor: 'white', fillOpacity: 1, weight: 2 }).addTo(target);
                    var tIcons = { 'plane':'✈️','train':'🚂','bus':'🚌','car':'🚗','truck':'🚚' };
                    var tIcon = L.divIcon({ className: 'trans-center-marker', html: tIcons[p.transport] || '🚀', iconSize:[32,32], iconAnchor:[16,16] });
                    L.marker([(p.from[0]+p.to[0])/2, (p.from[1]+p.to[1])/2], {icon: tIcon}).addTo(target).bindPopup(createPopup(p, folder));
                    L.polylineDecorator(line, { patterns: [{ offset: '20%', repeat: '40%', symbol: L.Symbol.arrowHead({pixelSize: 12, pathOptions: {color: hex, fillOpacity: 1, weight: 0}}) }] }).addTo(target);
                }
            });
        }

        function createPopup(p, folder) {
            var html = '<div class="popup-box"><b>' + p.title + '</b><p>' + p.desc + '</p><div class="btn-row">';
            if (p.link) html += '<a href="view.html?folder='+folder+'&file='+p.link+'" class="btn btn-track" target="_blank">Трек</a>';
            if (p.vk) html += '<a href="'+p.vk+'" class="btn btn-vk" target="_blank">VK</a>';
            if (p.relive) html += '<a href="'+p.relive+'" class="btn btn-3d" target="_blank">3D</a>';
            return html + '</div></div>';
        }

        function loadPhotos(repo, hex) {
            fetch(`https://mieszko1979.github.io/${repo}/photos.json?t=${Date.now()}`).then(r => r.json()).then(data => {
                data.forEach(photo => {
                    // SVG с раритетной вспышкой (лучами) и без плотного фона центра
                    var svg = `<svg width="36" height="36" viewBox="0 0 36 36" class="flash-rays">
                        <g transform="translate(18,18)">
                            <line x1="0" y1="-12" x2="0" y2="-18" stroke="#FFD700" stroke-width="2" />
                            <line x1="0" y1="12" x2="0" y2="18" stroke="#FFD700" stroke-width="2" />
                            <line x1="-12" y1="0" x2="-18" y2="0" stroke="#FFD700" stroke-width="2" />
                            <line x1="12" y1="0" x2="18" y2="0" stroke="#FFD700" stroke-width="2" />
                            <line x1="8" y1="8" x2="13" y2="13" stroke="#FFD700" stroke-width="2" />
                            <line x1="-8" y1="-8" x2="-13" y2="-13" stroke="#FFD700" stroke-width="2" />
                            <line x1="8" y1="-8" x2="13" y2="-13" stroke="#FFD700" stroke-width="2" />
                            <line x1="-8" y1="8" x2="-13" y2="13" stroke="#FFD700" stroke-width="2" />
                        </g>
                        <rect x="10" y="13" width="16" height="12" rx="2" fill="white" stroke="${hex}" stroke-width="1.5" />
                        <circle cx="18" cy="19" r="3.5" stroke="${hex}" stroke-width="1.5" fill="none" />
                        <rect x="13" y="11" width="4" height="2" fill="${hex}" />
                    </svg>`;
                    // Смещение иконки (iconAnchor), чтобы камера не была ровно в центре точки ночевки
                    L.marker([photo.lat, photo.lng], {icon: L.divIcon({ className: 'photo-marker', html: svg, iconSize: [36, 36], iconAnchor: [0, 36] })})
                    .addTo(photoClusterGroup).on('click', () => { document.getElementById('view-img').src = `https://mieszko1979.github.io/${repo}/${photo.url}`; document.getElementById('photo-viewer').style.display = 'flex'; });
                });
            });
        }
        function focusOnCurrent() { if (typeof myPoints !== 'undefined' && myPoints.length > 0) { var last = myPoints[myPoints.length-1]; var lat = last.lat || (last.from ? last.from[0] : 50); var lng = last.lng || (last.from ? last.from[1] : 80); map.setView([lat, lng], 8); } }
        if (typeof myPoints !== 'undefined') { focusOnCurrent(); updateMarkers(true); }
    </script>
</body>
</html>
