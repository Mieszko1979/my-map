<!DOCTYPE html>
<html>
<head>
    <title>Мой Велоархив</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
    
    <script src="about.js"></script>
    <script src="points.js"></script>
    <script src="archive/2018/points.js"></script>
    <script src="archive/2019/points.js"></script>
    <script src="archive/2021/points.js"></script>
    <script src="archive/2024/points.js"></script>

    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        
        /* УПРАВЛЕНИЕ МЕНЮ */
        #menu-box { position: absolute; top: 15px; left: 15px; z-index: 1000; background: rgba(255, 255, 255, 0.95); padding: 15px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); min-width: 300px; transition: all 0.3s ease; }
        .menu-collapse-btn { display: flex; justify-content: space-between; align-items: center; font-weight: bold; cursor: pointer; color: #333; }
        #menu-content { max-height: 1000px; overflow: hidden; opacity: 1; transition: all 0.3s ease; margin-top: 15px; padding-top: 12px; border-top: 1px solid #ccc; }
        #menu-box.collapsed #menu-content { max-height: 0; opacity: 0; margin-top: 0; padding-top: 0; border-top: none; }
        #menu-box.collapsed #menu-chevron { transform: rotate(180deg); }
        .trip-item { margin-bottom: 12px; display: flex; align-items: center; font-size: 14px; font-weight: bold; }
        .fs-btn { background: none; border: none; cursor: pointer; font-size: 18px; color: #666; margin-left: 20px; }

        /* ВИЗИТКА ЦЕНТРАЛЬНАЯ */
        #hint-box { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(255, 255, 255, 0.95); padding: 10px 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); cursor: pointer; text-align: center; transition: 0.2s ease; }
        .hint-text { color: #ff0000; font-weight: 900; font-size: 17px; text-transform: uppercase; letter-spacing: 1px; }

        /* МОДАЛЬНОЕ ОКНО */
        #about-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); z-index: 6000; justify-content: center; align-items: center; backdrop-filter: blur(3px); }
        .modal-wrapper { display: flex; align-items: center; gap: 25px; transition: 0.3s; }
        
        .modal-content { background: white; width: 400px; border-radius: 24px; padding: 30px; text-align: center; position: relative; box-shadow: 0 15px 50px rgba(0,0,0,0.6); transition: transform 0.1s linear; }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; color: #ccc; }

        /* БОКОВЫЕ ПАНЕЛИ */
        .side-panel { background: rgba(255,255,255,0.98); width: 230px; border-radius: 24px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); display: none; flex-direction: column; align-items: center; }

        /* АНИМАЦИЯ ВЗРЫВА */
        @keyframes popOut {
            0% { opacity: 0; transform: scale(0.3) translateY(40px); }
            70% { transform: scale(1.1) translateY(-5px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .pop-item { opacity: 0; transform: scale(0.3); }
        .is-exploding .pop-item { animation: popOut 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* СОЦСЕТИ */
        .social-icons { display: flex; justify-content: center; gap: 15px; margin: 20px 0; flex-wrap: wrap; }
        .social-icons i { font-size: 32px; transition: 0.2s; }
        .social-icons a:hover i { transform: scale(1.2); }
        .text-icon-btn { font-weight: 900; font-size: 12px; border: 2.5px solid #555; padding: 5px 10px; border-radius: 10px; color: #333; text-transform: uppercase; }

        /* КНОПКА ПОДДЕРЖКИ */
        @keyframes pulseBtn { 0% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.5); } 70% { box-shadow: 0 0 0 20px rgba(40, 167, 69, 0); } 100% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); } }
        .pulse-support-btn { width: 100%; padding: 18px; margin-top: 20px; background: #28a745; color: white; border: none; border-radius: 15px; font-weight: 900; font-size: 18px; cursor: pointer; animation: pulseBtn 2s infinite; transition: 0.2s; }
        .pulse-support-btn:active { transform: scale(0.95); }

        /* ЭЛЕМЕНТЫ ПАНЕЛЕЙ */
        .qr-img { width: 160px; height: 160px; border-radius: 12px; border: 1px solid #eee; margin: 10px 0; }
        .pay-link-btn { display: block; width: 100%; text-decoration: none; padding: 12px; border-radius: 12px; margin-bottom: 12px; font-weight: bold; font-size: 14px; text-align: center; box-sizing: border-box; transition: 0.2s; }
        .pay-link-btn:hover { filter: brightness(1.1); transform: translateX(5px); }
        
        .crypto-box { width: 100%; background: #f8f9fa; padding: 12px; border-radius: 12px; border: 1.5px dashed #ccc; cursor: pointer; position: relative; margin-top: 10px; text-align: left; }
        .crypto-addr { font-family: monospace; font-size: 11px; word-break: break-all; color: #333; display: block; margin-top: 5px; }
        .copy-hint { position: absolute; top: -18px; right: 0; font-size: 11px; color: #28a745; opacity: 0; transition: 0.3s; font-weight: bold; }

        /* МОБИЛЬНАЯ ВЕРСИЯ */
        @media (max-width: 768px) {
            #about-modal { align-items: flex-end; }
            .modal-wrapper { flex-direction: column; width: 100%; gap: 0; transition: none; }
            .modal-content { 
                width: 100%; border-radius: 30px 30px 0 0; max-height: 85vh; overflow-y: auto; 
                padding-top: 15px; /* Место для индикатора смахивания */
            }
            /* Полоска-индикатор для свайпа */
            .modal-content::before { content: ""; width: 40px; height: 5px; background: #ddd; border-radius: 10px; display: block; margin: 0 auto 15px; }
            
            .side-panel { width: 100%; background: none; box-shadow: none; display: flex !important; animation: none; padding: 0; }
            .side-left { display: none !important; }
            .pulse-support-btn { display: none !important; }
            .side-right { display: flex !important; padding: 20px; border-top: 1px solid #eee; }
            .pop-item { opacity: 1; transform: none; } /* Отключаем взрыв на мобилках для скорости */
        }

        /* МАРКЕРЫ И ПРОЧЕЕ (Без изменений) */
        .day-marker { background: #fff; border-radius: 50%; border: 2.5px solid; color: #000; font-weight: bold; display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.5); font-size: 11px; width: 24px !important; height: 24px !important; overflow: hidden; }
        @keyframes softPulse { 0% { box-shadow: 0 0 0 0px rgba(40, 167, 69, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(40, 167, 69, 0); } 100% { box-shadow: 0 0 0 0px rgba(40, 167, 69, 0); } }
        .last-point-pulse { animation: softPulse 3s infinite ease-in-out; z-index: 1000 !important; }
        .map-avatar { position: absolute; bottom: 25px; right: 10px; z-index: 1000; width: 60px; height: 60px; border-radius: 50%; border: 2px solid white; opacity: 0.8; pointer-events: none; object-fit: cover; }
        #photo-viewer { position: absolute; bottom: 100px; left: 15px; z-index: 1000; width: 220px; background: white; padding: 5px; border-radius: 8px; display: none; }
        #photo-viewer img { width: 100%; border-radius: 5px; }
    </style>
</head>
<body>
    <button id="mobile-photo-btn" onclick="togglePhotos()"><i class="fa-solid fa-camera"></i></button>
    <iframe id="detail-overlay" src=""></iframe>
    
    <div id="about-modal" onclick="closeAbout()">
        <div id="modal-wrapper" class="modal-wrapper" onclick="event.stopPropagation()">
            
            <div id="side-qr" class="side-panel side-left">
                <h3 style="margin:0 0 15px 0; font-size:18px;">QR-коды</h3>
                <div id="qr-container" style="width:100%"></div>
            </div>

            <div id="central-modal" class="modal-content">
                <span class="close-modal" onclick="closeAbout()">&times;</span>
                <b id="about-name" style="font-size: 26px; display: block; margin-bottom: 10px;"></b>
                <p id="about-bio" style="font-size: 16px; line-height: 1.5; color: #444; margin-bottom: 20px;"></p>
                <div class="social-icons" id="about-socials"></div>
                <button id="support-trigger" class="pulse-support-btn" onclick="expandSupport()">ПОДДЕРЖАТЬ ПРОЕКТ</button>
            </div>

            <div id="side-pay" class="side-panel side-right">
                <h3 style="margin:0 0 15px 0; font-size:18px;">Оплата</h3>
                <div id="pay-container" style="width:100%"></div>
                <div id="crypto-container" style="width:100%"></div>
            </div>

        </div>
    </div>

    <div id="hint-box" onclick="openAbout()"><span class="hint-text">ЖМИ СЮДА</span></div>
    <img src="avatar.jpg" class="map-avatar">
    
    <div id="menu-box">
        <div class="menu-collapse-btn" onclick="toggleMenu()">
            <span><i class="fa-solid fa-map-location-dot" style="margin-right:8px; color:#28a745;"></i>Управление</span>
            <div><button class="fs-btn" onclick="event.stopPropagation(); toggleFullscreen()"><i class="fa-solid fa-expand"></i></button><i class="fa-solid fa-chevron-up" id="menu-chevron"></i></div>
        </div>
        <div id="menu-content">
            <div style="font-weight:bold; margin-bottom:10px;"><input type="checkbox" id="main-toggle" onchange="toggleList()"> Мои велопутешествия</div>
            <div id="trip-list" style="display:none; padding-left:10px;">
                <div class="trip-item c2018"><input type="checkbox" class="trip-check" id="chk2018" onchange="updateMarkers(false)"> 1. Яранск - Паттайя (2018)</div>
                <div class="trip-item c2019"><input type="checkbox" class="trip-check" id="chk2019" onchange="updateMarkers(false)"> 2. Яранск - Иран (2019)</div>
                <div class="trip-item c2021"><input type="checkbox" class="trip-check" id="chk2021" onchange="updateMarkers(false)"> 3. Яранск - Байкал (2021)</div>
                <div class="trip-item c2024"><input type="checkbox" class="trip-check" id="chk2024" onchange="updateMarkers(false)"> 4. Яранск - Армения (2024)</div>
            </div>
            <div style="margin-top:10px; border-top:1px dashed #ccc; padding-top:10px;"><input type="checkbox" id="photo-toggle" onchange="updateMarkers(true)"> 📷 Показать фото</div>
        </div>
    </div>

    <div id="map"></div>
    <div id="photo-viewer" onclick="handleBackgroundClick()"><div style="position:absolute; top:-10px; right:-10px; background:red; color:white; border-radius:50%; width:24px; height:24px; text-align:center; cursor:pointer;" onclick="closePhoto()">×</div><img id="view-img" src="" onclick="handlePhotoClick(event)"></div>

    <script>
        var map = L.map('map', {zoomControl: false, attributionControl: true}).setView([50, 80], 4);
        map.attributionControl.setPrefix('Мое велопутешествие');
        L.tileLayer('http://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains:['mt0','mt1','mt2','mt3'] }).addTo(map);

        var currentTripLayer = L.layerGroup().addTo(map), archiveLayerGroup = L.layerGroup().addTo(map), photoClusterGroup = L.markerClusterGroup({ maxClusterRadius: 40 }).addTo(map);
        var borderClusterGroup = L.markerClusterGroup({ spiderfyOnMaxZoom: true, maxClusterRadius: 30 }).addTo(map);
        var hexColors = { 'c2018': '#ff0000', 'c2019': '#007bff', 'c2021': '#9b59b6', 'c2024': '#ff8c00', 'cCurrent': '#28a745' };

        // ЛОГИКА ОКНА "О СЕБЕ"
        function openAbout() {
            if (typeof aboutData === 'undefined') return;
            document.getElementById('about-name').innerText = aboutData.name;
            document.getElementById('about-bio').innerText = aboutData.bio;
            
            // Соцсети
            var sHtml = ""; 
            aboutData.socials.forEach(s => { 
                if(s.url) { 
                    if (s.id === 'dzen' || s.id === 'komoot') sHtml += `<a href="${s.url}" target="_blank"><span class="text-icon-btn">${s.id.toUpperCase()}</span></a>`; 
                    else sHtml += `<a href="${s.url}" target="_blank"><i class="fa-brands fa-${s.id}"></i></a>`; 
                } 
            });
            document.getElementById('about-socials').innerHTML = sHtml;

            // Куар коды с классом анимации
            var qHtml = ""; 
            aboutData.support.qrCodes.forEach(q => { qHtml += `<div class="qr-item pop-item"><b>${q.name}</b><br><img src="${q.img}" class="qr-img"></div>`; });
            document.getElementById('qr-container').innerHTML = qHtml;

            // Кнопки с классом анимации
            var bHtml = "";
            aboutData.support.buttons.forEach(b => {
                if(b.url) bHtml += `<a href="${b.url}" target="_blank" class="pay-link-btn pop-item" style="background:${b.color}; color:${b.textColor};">${b.name}</a>`;
            });
            document.getElementById('pay-container').innerHTML = bHtml;

            // Крипта
            if(aboutData.support.crypto && aboutData.support.crypto.address) {
                document.getElementById('crypto-container').innerHTML = `<div class="crypto-box pop-item" onclick="copyCrypto()">
                    <span class="copy-hint" id="copy-ok">Скопировано!</span>
                    <span style="font-size:11px; color:#666;">${aboutData.support.crypto.name}</span>
                    <span class="crypto-addr">${aboutData.support.crypto.address}</span>
                </div>`;
            }

            if(window.innerWidth > 768) {
                document.getElementById('side-qr').style.display = 'none';
                document.getElementById('side-pay').style.display = 'none';
                document.getElementById('support-trigger').style.display = 'block';
                document.getElementById('modal-wrapper').classList.remove('is-exploding');
            }

            document.getElementById('about-modal').style.display = 'flex';
            resetSwipe(); // Сброс позиции шторки
        }

        function expandSupport() {
            var wrapper = document.getElementById('modal-wrapper');
            document.getElementById('side-qr').style.display = 'flex';
            document.getElementById('side-pay').style.display = 'flex';
            document.getElementById('support-trigger').style.display = 'none';
            
            // Запуск анимации взрыва
            setTimeout(() => {
                wrapper.classList.add('is-exploding');
                // Добавляем задержку появления для каждого элемента
                document.querySelectorAll('.pop-item').forEach((el, index) => {
                    el.style.animationDelay = (index * 0.1) + 's';
                });
            }, 10);
        }

        function closeAbout() { document.getElementById('about-modal').style.display = 'none'; }

        // СИСТЕМА СВАЙПА ВНИЗ (ДЛЯ МОБИЛОК)
        var touchStartY = 0, touchCurrentY = 0;
        var modalContent = document.getElementById('central-modal');

        modalContent.addEventListener('touchstart', function(e) {
            touchStartY = e.touches[0].clientY;
        }, {passive: true});

        modalContent.addEventListener('touchmove', function(e) {
            if (window.innerWidth > 768) return;
            touchCurrentY = e.touches[0].clientY;
            var diff = touchCurrentY - touchStartY;
            if (diff > 0) { // Тянем вниз
                modalContent.style.transform = `translateY(${diff}px)`;
            }
        }, {passive: true});

        modalContent.addEventListener('touchend', function(e) {
            if (window.innerWidth > 768) return;
            var diff = touchCurrentY - touchStartY;
            if (diff > 100) { // Порог закрытия 100px
                closeAbout();
            } else {
                modalContent.style.transform = `translateY(0)`; // Возвращаем на место
            }
            touchStartY = 0; touchCurrentY = 0;
        });

        function resetSwipe() { modalContent.style.transform = `translateY(0)`; }

        function copyCrypto() {
            var addr = aboutData.support.crypto.address;
            navigator.clipboard.writeText(addr).then(() => {
                var hint = document.getElementById('copy-ok');
                hint.style.opacity = "1";
                setTimeout(() => { hint.style.opacity = "0"; }, 2000);
            });
        }

        // КАРТА И МАРКЕРЫ (Без изменений функционала)
        function toggleMenu() { document.getElementById('menu-box').classList.toggle('collapsed'); }
        function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
        function toggleList() { var show = document.getElementById('main-toggle').checked; document.getElementById('trip-list').style.display = show ? 'block' : 'none'; updateMarkers(true); }
        function togglePhotos() { var chk = document.getElementById('photo-toggle'); chk.checked = !chk.checked; updateMarkers(true); }

        function updateMarkers(onlyPhotos) {
            archiveLayerGroup.clearLayers(); photoClusterGroup.clearLayers(); borderClusterGroup.clearLayers();
            var showPhotos = document.getElementById('photo-toggle').checked;
            if (document.getElementById('main-toggle').checked) {
                if (document.getElementById('chk2018').checked) { drawTrip(points2018, archiveLayerGroup, 'c2018', 'archive/2018/'); if(showPhotos) loadPhotos('archive-2018-photos', '#ff0000'); }
                if (document.getElementById('chk2019').checked) { drawTrip(points2019, archiveLayerGroup, 'c2019', 'archive/2019/'); if(showPhotos) loadPhotos('archive-2019-photos', '#007bff'); }
                if (document.getElementById('chk2021').checked) { drawTrip(points2021, archiveLayerGroup, 'c2021', 'archive/2021/'); if(showPhotos) loadPhotos('archive-2021-photos', '#9b59b6'); }
                if (document.getElementById('chk2024').checked) { drawTrip(points2024, archiveLayerGroup, 'c2024', 'archive/2024/'); if(showPhotos) loadPhotos('archive-2024-photos', '#ff8c00'); }
            } else {
                if (typeof myPoints !== 'undefined') drawTrip(myPoints, currentTripLayer, 'cCurrent', 'tracks/');
                if(showPhotos) loadPhotos('archive-2026-photos', '#28a745');
            }
        }

        function drawTrip(data, target, colorClass, folder) {
            data.forEach((p, i) => {
                if (p.type === 'border') {
                    var flagHtml = `<div class="flag-stuck"><div style="width:4px; height:50px; background:#444; position:relative;"><img src="https://flagcdn.com/w80/${p.country.toLowerCase().trim()}.png" style="position:absolute; top:0; left:4px; width:45px; border:1.5px solid #fff; box-shadow: 3px 3px 7px rgba(0,0,0,0.4);"></div></div>`;
                    L.marker([p.lat, p.lng], {icon: L.divIcon({ className: '', html: flagHtml, iconSize: [50, 50], iconAnchor: [2, 50] })}).addTo(borderClusterGroup).bindPopup(createPopup(p, folder));
                } else if (!p.type || p.type === 'day') {
                    var isLast = (folder === 'tracks/' && i === data.length - 1);
                    L.marker([p.lat, p.lng], {icon: L.divIcon({ className: 'day-marker ' + colorClass + (isLast ? ' last-point-pulse' : ''), html: p.day || (i+1), iconSize: [24, 24] })}).addTo(target).bindPopup(createPopup(p, folder));
                }
            });
        }
        function createPopup(p, folder) { 
            var h = `<div style="text-align:center;"><b>${p.title}</b><p>${p.desc}</p><div style="font-size:11px;color:#777;margin-bottom:10px;">${p.lat}, ${p.lng}</div>`;
            if(p.link) h += `<a onclick="openTrackView('view.html?folder=${folder}&file=${p.link}')" class="btn btn-track" style="background:#28a745;color:white;padding:5px 15px;border-radius:20px;text-decoration:none;cursor:pointer;">Трек</a>`;
            if(p.vk) h += `<a href="${p.vk}" target="_blank" style="background:#0077ff;color:white;padding:5px 15px;border-radius:20px;text-decoration:none;margin-left:5px;">VK</a>`;
            if(p.dzen) h += `<a href="${p.dzen}" target="_blank" style="background:#000;color:white;padding:5px 15px;border-radius:20px;text-decoration:none;margin-left:5px;">Дзен</a>`;
            return h + '</div>';
        }
        function loadPhotos(repo, hex) { fetch(`https://mieszko1979.github.io/${repo}/photos.json?t=${Date.now()}`).then(r => r.json()).then(data => { data.forEach(photo => { var svg = `<svg width="30" height="38" viewBox="0 0 34 42"><path d="M17 0C7.6 0 0 7.6 0 17c0 12.8 17 25 17 25s17-12.2 17-25c0-9.4-7.6-17-17-17z" fill="${hex}"/><circle cx="17" cy="17" r="10" fill="white"/><g transform="translate(10, 12) scale(0.6)"><path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="${hex}"/><circle cx="12" cy="13" r="3" fill="${hex}" /></g></svg>`; L.marker([photo.lat, photo.lng], {icon: L.divIcon({ className: 'photo-marker', html: svg, iconSize: [30, 38], iconAnchor:[15, 38] })}).addTo(photoClusterGroup).on('click', () => { document.getElementById('view-img').src = `https://mieszko1979.github.io/${repo}/${photo.url}`; document.getElementById('photo-viewer').style.display = 'block'; }); }); }); }
        function closePhoto() { document.getElementById('photo-viewer').style.display = 'none'; }
        function handlePhotoClick(e) { if(window.innerWidth > 768) window.open(e.target.src, '_blank'); }
        function handleBackgroundClick() { if(window.innerWidth <= 768) closePhoto(); }
        
        if (typeof myPoints !== 'undefined') { var last = myPoints[myPoints.length-1]; map.setView([last.lat, last.lng], 8); updateMarkers(true); }
    </script>
</body>
</html>
